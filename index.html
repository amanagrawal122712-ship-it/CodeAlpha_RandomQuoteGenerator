
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Random Quote Generator | CodeAlpha</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="background-glow glow-one"></div>
    <div class="background-glow glow-two"></div>

    <main class="app-container">

        <header class="app-header">
            <div class="logo">✦ QuoteVerse</div>
            <p class="subtitle">
                Your daily dose of inspiration
            </p>
        </header>

        <section class="quote-card">

            <div class="card-top">
                <span class="category-badge" id="quoteCategory">
                    Inspiration
                </span>

                <span class="quote-number" id="quoteNumber">
                    Quote #01
                </span>
            </div>

            <div class="quote-content">

                <div class="quote-icon">“</div>

                <blockquote id="quoteText" aria-live="polite">
                    Click New Quote to discover inspiration.
                </blockquote>

                <div class="author-section">
                    <div class="author-line"></div>

                    <p id="quoteAuthor">
                        — QuoteVerse
                    </p>
                </div>

            </div>

            <div class="quote-actions">

                <button id="previousBtn"
                        class="secondary-btn"
                        type="button">
                    ← Previous
                </button>

                <button id="copyBtn"
                        class="secondary-btn"
                        type="button">
                    Copy Quote
                </button>

                <button id="newQuoteBtn"
                        class="primary-btn"
                        type="button">
                    ✨ New Quote
                </button>

            </div>

        </section>

        <div class="bottom-section">

            <div class="quote-counter">
                <span class="counter-icon">✦</span>

                <span id="totalQuotes">
                    Discover inspiring quotes
                </span>
            </div>

            <p class="hint-text">
                A little inspiration goes a long way.
            </p>

        </div>

        <footer class="footer">
            <p>
                Made with ♥ | CodeAlpha Internship
            </p>
            <p>
                Random Quote Generator — Task 2
            </p>
        </footer>

    </main>

    <div id="toast" class="toast" role="status" aria-live="polite">
        Quote copied successfully!
    </div>

    <script src="script.js"></script>

</body>
</html>
